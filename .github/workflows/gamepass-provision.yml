name: Collision Battlestar GamePass Provisioner

on:
  push:
    paths:
      - "gamepasses/manifest.json"
      - ".github/gamepasses/provision.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  provision:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[provision-gamepasses]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Provision game passes
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: "5290480963"
        run: |
          set -euo pipefail
          test -n "${ROBLOX_API_KEY}"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path('.github/gamepasses/provision.json').read_text())
          if request.get('create') is not True:
              raise SystemExit('Provision request is not armed.')

          key = os.environ['ROBLOX_API_KEY']
          universe = os.environ['UNIVERSE_ID']
          manifest = json.loads(Path('gamepasses/manifest.json').read_text())
          headers = ['-H', 'x-api-key: ' + key, '-H', 'Content-Type: application/json']
          list_url = 'https://apis.roblox.com/game-passes/v1/universes/' + universe + '/game-passes/creator?pageSize=50'
          existing = json.loads(subprocess.check_output(['curl', '-fsS', *headers, list_url], text=True))
          by_name = {str(item.get('name')): item for item in existing.get('gamePasses', [])}
          ids = {}

          for item in manifest['passes']:
              found = by_name.get(item['name'])
              if found:
                  ids[item['key']] = int(found['gamePassId'])
                  continue
              create_url = 'https://apis.roblox.com/game-passes/v1/universes/' + universe + '/game-passes'
              form = [
                  '-F', 'name=' + item['name'],
                  '-F', 'description=' + item['description'],
                  '-F', 'isForSale=true',
                  '-F', 'price=' + str(int(item['price'])),
                  '-F', 'isRegionalPricingEnabled=true',
              ]
              created = json.loads(subprocess.check_output(['curl', '-fsS', '--request', 'POST', '-H', 'x-api-key: ' + key, *form, create_url], text=True))
              game_pass_id = created.get('gamePassId')
              if not isinstance(game_pass_id, int) or game_pass_id <= 0:
                  raise SystemExit('Invalid game pass ID for ' + item['name'])
              ids[item['key']] = game_pass_id

          lines = ['--!strict', '', 'return {']
          for item in manifest['passes']:
              lines.append('    {} = {},'.format(item['key'], ids[item['key']]))
          lines.append('}')
          Path('src/CollisionBattlestar/ReplicatedStorage/Shared/GamePassIds.lua').write_text('\n'.join(lines) + '\n')
          request['create'] = False
          request['status'] = 'consumed'
          Path('.github/gamepasses/provision.json').write_text(json.dumps(request, indent=2) + '\n')
          PY
      - name: Commit generated IDs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CollisionBattlestar/ReplicatedStorage/Shared/GamePassIds.lua .github/gamepasses/provision.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: provision game pass ids"
          git push