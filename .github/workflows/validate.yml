name: Roube Um Animal - Validate and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roube-animal-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Validate project structure and gameplay wiring
        run: python3 tools/validate_roube_animal.py
      - name: Run gameplay rule tests
        run: luau tools/tests/run.luau
      - name: Validate map and animal spawn coverage
        run: python3 tools/tests/test_map_layout.py
      - name: Validate monetization IDs and product separation
        run: python3 tools/tests/test_monetization.py
      - name: Validate core boot, map fallback, diagnostics and animal brain
        run: python3 tools/tests/test_core_reliability.py
      - name: Install pinned Luau syntax checker
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/luau-ubuntu.zip"
          curl -fsSL "https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip" -o "$archive"
          echo "8a9b4b381021722c82d6e6cda0964b5c9e7f354ec1035fcd8b657acc22e49247  $archive" | sha256sum -c -
          mkdir -p /tmp/luau-cli
          unzip -q "$archive" -d /tmp/luau-cli
          compiler="$(find /tmp/luau-cli -type f -name 'luau-compile' -print -quit)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "LUAU_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Parse every Luau source file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source_file; do
            "$LUAU_COMPILER" --only-parse "$source_file" >/dev/null
          done < <(find src/RoubeUmAnimal -type f -name '*.lua' -print0)
      - name: Build Roblox place
        run: |
          set -euo pipefail
          mkdir -p build
          rojo build default.project.json --output build/StealAnAnimal.rbxl
          test -s build/StealAnAnimal.rbxl
          stat -c "%s bytes" build/StealAnAnimal.rbxl
      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealAnAnimal
          path: build/StealAnAnimal.rbxl
          if-no-files-found: error
