name: Steal An Animal - Validate, Parse, and Build r7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steal-animal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Install pinned Luau syntax checker
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/luau-ubuntu.zip"
          curl -fsSL "https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip" -o "$archive"
          echo "8a9b4b381021722c82d6e6cda0964b5c9e7f354ec1035fcd8b657acc22e49247  $archive" | sha256sum -c -
          mkdir -p /tmp/luau-cli
          unzip -q "$archive" -d /tmp/luau-cli
          compiler="$(find /tmp/luau-cli -type f -name 'luau-compile' -print -quit)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "LUAU_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Parse every active Luau source file before running tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source_file; do
            echo "Parsing $source_file"
            "$LUAU_COMPILER" --only-parse "$source_file" >/dev/null
          done < <(find src/StealAnAnimal tools/studio-tests -type f -name '*.lua' -print0)
      - name: Validate project structure and gameplay wiring
        run: python3 tools/validate_roube_animal.py
      - name: Run gameplay rule tests
        run: luau tools/tests/run.luau
      - name: Validate map and animal spawn coverage
        run: python3 tools/tests/test_map_layout.py
      - name: Validate removal of monetization
        run: python3 tools/tests/test_monetization.py
      - name: Validate core reliability
        run: python3 tools/tests/test_core_reliability.py
      - name: Validate Studio QA bot harness
        run: python3 tools/tests/test_studio_audit.py
      - name: Build Roblox place
        run: |
          set -euo pipefail
          mkdir -p build
          rojo build default.project.json --output build/StealAnAnimal.rbxl
          test -s build/StealAnAnimal.rbxl
          stat -c "%s bytes" build/StealAnAnimal.rbxl
      - name: Parse the generated RBXL and verify embedded Workspace map
        run: python3 tools/tests/test_rbxl_file.py build/StealAnAnimal.rbxl
      - name: Simulate Studio run and write complete diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          python3 tools/simulate_studio_run.py --report artifacts/studio-run-simulation.json --markdown artifacts/studio-run-simulation.md --place build/StealAnAnimal.rbxl 2>&1 | tee artifacts/studio-run-simulation.log
          result=${PIPESTATUS[0]}
          set -e
          if [[ -f artifacts/studio-run-simulation.md ]]; then
            cat artifacts/studio-run-simulation.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealAnAnimal-studio-audit-r7
          path: build/StealAnAnimal.rbxl
          if-no-files-found: error
      - name: Upload simulated Studio report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StealAnAnimal-simulated-studio-report
          path: |
            artifacts/studio-run-simulation.json
            artifacts/studio-run-simulation.md
            artifacts/studio-run-simulation.log
          if-no-files-found: warn
