name: Collision Battlestar Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true

      - name: Python automation syntax validation
        run: |
          python3 -m py_compile tools/validate_project.py
          python3 -m py_compile tools/validate_no_ai.py
          python3 tools/validate_no_ai.py


      - name: Compile every active Luau file
        run: |
          set -euo pipefail
          mkdir -p .ci/luau
          curl -fsSL "https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip" -o .ci/luau/luau.zip
          unzip -q -o .ci/luau/luau.zip -d .ci/luau/bin
          chmod +x .ci/luau/bin/luau-compile
          while IFS= read -r -d '' file; do
            .ci/luau/bin/luau-compile --only-parse "$file" >/dev/null
          done < <(find src/CollisionBattlestar -type f -name '*.lua' -print0)

      - name: Build active place
        run: |
          mkdir -p build
          rojo build default.project.json --output build/CollisionBattlestar.rbxl
          test -s build/CollisionBattlestar.rbxl

      - name: Generate active sourcemap
        run: rojo sourcemap default.project.json --output build/sourcemap.json

      - name: Reject legacy runtime files and markers
        run: |
          set -euo pipefail
          ! find src/CollisionBattlestar -type f \( -name "QARunner.client.lua" -o -name "QAService.server.lua" \) -print -quit | grep -q .
          ! grep -RniE "HUDRecovery|WorldBuilder|MapAssetLoader|DestructionService" src/CollisionBattlestar || true
