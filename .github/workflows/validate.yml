name: Collision Battlestar Clean Runtime Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collision-battlestar-clean-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Run clean Luau tests
        run: luau tools/tests/run.luau
      - name: Validate clean runtime
        run: python3 tools/validate_project.py
      - name: Build Roblox place
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          rojo build default.project.json --output build/CollisionBattlestar.rbxl
          test -s build/CollisionBattlestar.rbxl
          stat -c "%s bytes" build/CollisionBattlestar.rbxl
