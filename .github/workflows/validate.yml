name: Roube Um Animal - Validate and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roube-animal-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Validate project structure and gameplay wiring
        run: python3 tools/validate_roube_animal.py
      - name: Parse every Luau source file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source_file; do
            luau-compile --only-parse "$source_file" >/dev/null
          done < <(find src/RoubeUmAnimal -type f -name '*.lua' -print0)
      - name: Build Roblox place
        run: |
          set -euo pipefail
          mkdir -p build
          rojo build default.project.json --output build/RoubeUmAnimal.rbxl
          test -s build/RoubeUmAnimal.rbxl
          stat -c "%s bytes" build/RoubeUmAnimal.rbxl
      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoubeUmAnimal
          path: build/RoubeUmAnimal.rbxl
          if-no-files-found: error
