name: Collision Battlestar V2 Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "rebuild/collision-battlestar-v2-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collision-battlestar-v2
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Run V2 tests
        run: luau tools/tests/run_v2.luau
      - name: Validate V2 architecture
        run: python3 tools/validate_v2.py
      - name: Build V2 Roblox place
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          rojo build default.project.json --output build/CollisionBattlestarV2.rbxl
          test -s build/CollisionBattlestarV2.rbxl
          stat -c "%s bytes" build/CollisionBattlestarV2.rbxl
