name: Collision Battlestar Validation

on:
  push:
    branches: [main, rebuild/collision-battlestar-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Parse Luau source
        run: find src -name '*.lua' -print0 | xargs -0 -n1 luau --mode=null
      - name: Run Luau unit tests
        run: luau tools/tests/run.luau
      - name: Run map layout test
        run: python3 tools/tests/test_map_layout.py
      - name: Validate source tree
        run: python3 tools/validate_project.py
      - name: Build place
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          rojo build default.project.json --output build/CollisionBattlestar.rbxl
          test -s build/CollisionBattlestar.rbxl
          stat -c "%s bytes" build/CollisionBattlestar.rbxl
