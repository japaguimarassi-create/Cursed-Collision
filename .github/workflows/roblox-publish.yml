name: Collision Battlestar Production Publisher

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm production publication from main"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collision-battlestar-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Run clean Luau tests
        run: luau tools/tests/run.luau
      - name: Validate clean runtime
        run: python3 tools/validate_project.py
      - name: Build Roblox place
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          rojo build default.project.json --output build/CollisionBattlestar.rbxl
          test -s build/CollisionBattlestar.rbxl
      - name: Publish production place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: "5290480963"
          PLACE_ID: "15338267657"
        run: |
          set -euo pipefail
          test -n "${ROBLOX_API_KEY}"
          test "${GITHUB_REF}" = "refs/heads/main"
          endpoint="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          code="$(curl --silent --show-error --location --request POST --url "${endpoint}" --header "x-api-key: ${ROBLOX_API_KEY}" --header "Content-Type: application/octet-stream" --data-binary "@build/CollisionBattlestar.rbxl" --output build/publish-response.json --write-out "%{http_code}")"
          cat build/publish-response.json
          [[ "${code}" =~ ^2[0-9][0-9]$ ]]
