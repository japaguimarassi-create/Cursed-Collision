name: Roube Um Animal - Manual Publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/roblox-publish.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm publishing ROUBE UM ANIMAL to the existing confirmed Roblox experience"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: roube-animal-manual-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-roube-um-animal]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Validate project
        run: python3 tools/validate_roube_animal.py
      - name: Run gameplay rule tests
        run: luau tools/tests/run.luau
      - name: Validate map and animal spawns
        run: python3 tools/tests/test_map_layout.py
      - name: Install pinned Luau syntax checker
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/luau-ubuntu.zip"
          curl -fsSL "https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip" -o "$archive"
          echo "8a9b4b381021722c82d6e6cda0964b5c9e7f354ec1035fcd8b657acc22e49247  $archive" | sha256sum -c -
          mkdir -p /tmp/luau-cli
          unzip -q "$archive" -d /tmp/luau-cli
          compiler="$(find /tmp/luau-cli -type f -name 'luau-compile' -print -quit)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "LUAU_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Parse every Luau source file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source_file; do
            "$LUAU_COMPILER" --only-parse "$source_file" >/dev/null
          done < <(find src/RoubeUmAnimal -type f -name '*.lua' -print0)
      - name: Build Roblox place
        run: |
          set -euo pipefail
          mkdir -p build
          rojo build default.project.json --output build/RoubeUmAnimal.rbxl
          test -s build/RoubeUmAnimal.rbxl
      - name: Publish only to the confirmed existing experience
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ vars.ROUBE_ANIMAL_UNIVERSE_ID || '5290480963' }}
          PLACE_ID: ${{ vars.ROUBE_ANIMAL_PLACE_ID || '15338267657' }}
        run: |
          set -euo pipefail
          test -n "${ROBLOX_API_KEY}" || { echo "::error::Missing repository secret ROBLOX_API_KEY"; exit 1; }
          test -n "${UNIVERSE_ID}" || { echo "::error::Universe ID is empty"; exit 1; }
          test -n "${PLACE_ID}" || { echo "::error::Place ID is empty"; exit 1; }
          [[ "${UNIVERSE_ID}" =~ ^[0-9]+$ ]] || { echo "::error::Universe ID must be numeric"; exit 1; }
          [[ "${PLACE_ID}" =~ ^[0-9]+$ ]] || { echo "::error::Place ID must be numeric"; exit 1; }
          endpoint="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          code="$(curl --silent --show-error --location --request POST --url "${endpoint}" --header "x-api-key: ${ROBLOX_API_KEY}" --header "Content-Type: application/octet-stream" --data-binary "@build/RoubeUmAnimal.rbxl" --output build/publish-response.json --write-out "%{http_code}")"
          cat build/publish-response.json
          [[ "${code}" =~ ^2[0-9][0-9]$ ]] || { echo "::error::Roblox rejected the publish request (HTTP ${code})."; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("build/publish-response.json").read_text(encoding="utf-8"))
          version = response.get("versionNumber")
          if not isinstance(version, int) or version < 1:
              raise SystemExit("Roblox returned HTTP success without a valid published version number.")
          print(f"Published Roblox place version {version}.")
          PY
