name: Cursed Collision - Roblox Publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm the real Roblox publication"
        required: true
        type: boolean
        default: false
      universe_id:
        description: "Roblox Universe ID"
        required: true
        type: string
        default: "5290480963"
      place_id:
        description: "Roblox Place ID"
        required: true
        type: string
        default: "15338267657"

permissions:
  contents: read

concurrency:
  group: cursed-collision-roblox-publish
  cancel-in-progress: false

env:
  ROBLOX_UNIVERSE_ID: ${{ inputs.universe_id }}
  ROBLOX_PLACE_ID: ${{ inputs.place_id }}

jobs:
  publish:
    name: Build and publish to Roblox
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify publish inputs
        shell: bash
        run: |
          set -euo pipefail

          [[ "${ROBLOX_UNIVERSE_ID}" =~ ^[0-9]+$ ]] || {
            echo "::error::Universe ID must contain only digits."
            exit 1
          }

          [[ "${ROBLOX_PLACE_ID}" =~ ^[0-9]+$ ]] || {
            echo "::error::Place ID must contain only digits."
            exit 1
          }

          if [[ "${ROBLOX_UNIVERSE_ID}" != "5290480963" ]]; then
            echo "::error::Universe ID does not match Cursed Collision."
            exit 1
          fi

          if [[ "${ROBLOX_PLACE_ID}" != "15338267657" ]]; then
            echo "::error::Place ID does not match Cursed Collision."
            exit 1
          fi

          echo "Target Universe: ${ROBLOX_UNIVERSE_ID}"
          echo "Target Place:    ${ROBLOX_PLACE_ID}"

      - name: Install Roblox toolchain
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      - name: Install pinned Roblox tools
        shell: bash
        run: |
          set -euo pipefail
          foreman install
          command -v rojo
          rojo --version

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_project.py

      - name: Build Roblox place
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          rojo build default.project.json --output build/CursedCollision.rbxl

          test -s build/CursedCollision.rbxl
          size="$(stat -c '%s' build/CursedCollision.rbxl)"

          if [[ "${size}" -lt 1024 ]]; then
            echo "::error::Generated RBXL is unexpectedly small (${size} bytes)."
            exit 1
          fi

          echo "Generated build: build/CursedCollision.rbxl"
          echo "Build size: ${size} bytes"

      - name: Publish place version
        id: publish
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${ROBLOX_API_KEY}" ]]; then
            echo "::error::ROBLOX_API_KEY repository secret is missing."
            exit 1
          fi

          endpoint="https://apis.roblox.com/universes/v1/${ROBLOX_UNIVERSE_ID}/places/${ROBLOX_PLACE_ID}/versions?versionType=Published"

          echo "Publishing Cursed Collision to Roblox..."
          echo "Universe: ${ROBLOX_UNIVERSE_ID}"
          echo "Place:    ${ROBLOX_PLACE_ID}"

          http_code="$(
            curl \
              --silent \
              --show-error \
              --location \
              --request POST \
              --url "${endpoint}" \
              --header "x-api-key: ${ROBLOX_API_KEY}" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@build/CursedCollision.rbxl" \
              --output build/publish-response.json \
              --write-out "%{http_code}"
          )"

          echo "Roblox HTTP status: ${http_code}"

          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Roblox rejected the publication request (HTTP ${http_code})."
            echo "Roblox response:"
            cat build/publish-response.json
            exit 1
          fi

          python3 - <<'PY'
import json
from pathlib import Path

path = Path("build/publish-response.json")
raw = path.read_text(encoding="utf-8").strip()

try:
    payload = json.loads(raw)
except json.JSONDecodeError as exc:
    raise SystemExit(f"Roblox returned a non-JSON success response: {exc}")

version = payload.get("versionNumber")

if not isinstance(version, int) or version <= 0:
    raise SystemExit(
        "Roblox returned HTTP 2xx but no valid versionNumber was found."
    )

print(f"Published Roblox place version: {version}")
PY

      - name: Upload publication artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cursed-collision-roblox-publish
          path: |
            build/CursedCollision.rbxl
            build/publish-response.json
          if-no-files-found: warn

  not-confirmed:
    name: Publish not confirmed
    if: ${{ inputs.confirm != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop without publishing
        run: |
          echo "Publication was NOT performed."
          echo "Set confirm=true to authorize the real Roblox publication."
