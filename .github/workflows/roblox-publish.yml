name: Steal An Animal - Explicit Manual Publisher

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm publishing the reviewed Steal An Animal build to the configured Roblox place"
        required: true
        type: boolean
        default: false
      confirm_studio_runtime_qa:
        description: "Confirm a real Roblox Studio multi-client and mobile-device playtest completed for this exact build"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: steal-animal-manual-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm == true && inputs.confirm_studio_runtime_qa == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Install pinned Luau syntax checker
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/luau-ubuntu.zip"
          curl -fsSL "https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip" -o "$archive"
          echo "8a9b4b381021722c82d6e6cda0964b5c9e7f354ec1035fcd8b657acc22e49247  $archive" | sha256sum -c -
          mkdir -p /tmp/luau-cli
          unzip -q "$archive" -d /tmp/luau-cli
          compiler="$(find /tmp/luau-cli -type f -name 'luau-compile' -print -quit)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "LUAU_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Parse active Luau source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source_file; do
            "$LUAU_COMPILER" --only-parse "$source_file" >/dev/null
          done < <(find src/StealAnAnimal -type f -name '*.lua' -print0)
      - name: Run automated checks
        run: |
          set -euo pipefail
          python3 tools/validate_roube_animal.py
          luau tools/tests/run.luau
          python3 tools/tests/test_map_layout.py
          python3 tools/tests/test_monetization.py
          python3 tools/tests/test_core_reliability.py
          python3 tools/tests/test_studio_audit.py
          python3 tools/tests/test_botx_npc.py
          python3 tools/tests/test_release_safety.py
      - name: Build reviewed place
        run: |
          set -euo pipefail
          mkdir -p build
          rojo build default.project.json --output build/StealAnAnimal.rbxl
          test -s build/StealAnAnimal.rbxl
          python3 tools/tests/test_rbxl_file.py build/StealAnAnimal.rbxl
          python3 tools/simulate_studio_run.py --report artifacts/studio-run-simulation.json --markdown artifacts/studio-run-simulation.md --place build/StealAnAnimal.rbxl
      - name: Verify runtime QA approval is tied to the exact source revision
        env:
          STUDIO_QA_SHA: ${{ vars.STEAL_ANIMAL_STUDIO_QA_SHA }}
        run: |
          set -euo pipefail
          test -n "${STUDIO_QA_SHA:-}" || { echo "::error::Set STEAL_ANIMAL_STUDIO_QA_SHA only after real Studio multi-client and mobile QA passes."; exit 1; }
          test "${STUDIO_QA_SHA}" = "${GITHUB_SHA}" || { echo "::error::Runtime QA approval SHA must exactly match this commit (${GITHUB_SHA}). Re-test this revision in Studio."; exit 1; }
          echo "Runtime QA attestation matches commit ${GITHUB_SHA}."

      - name: Publish only to explicitly configured place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ vars.STEAL_ANIMAL_UNIVERSE_ID }}
          PLACE_ID: ${{ vars.STEAL_ANIMAL_PLACE_ID }}
        run: |
          set -euo pipefail
          test -n "${ROBLOX_API_KEY}" || { echo "::error::Missing repository secret ROBLOX_API_KEY"; exit 1; }
          test -n "${UNIVERSE_ID}" || { echo "::error::Set repository variable STEAL_ANIMAL_UNIVERSE_ID to the confirmed universe ID"; exit 1; }
          test -n "${PLACE_ID}" || { echo "::error::Set repository variable STEAL_ANIMAL_PLACE_ID to the confirmed place ID"; exit 1; }
          [[ "${UNIVERSE_ID}" =~ ^[0-9]+$ ]] || { echo "::error::Universe ID must be numeric"; exit 1; }
          [[ "${PLACE_ID}" =~ ^[0-9]+$ ]] || { echo "::error::Place ID must be numeric"; exit 1; }
          endpoint="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http_code=$(curl --silent --show-error --location --write-out "%{http_code}" --output build/publish-response.json \
            --request POST --url "${endpoint}" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @build/StealAnAnimal.rbxl)
          echo "HTTP code: $http_code"
          cat build/publish-response.json
          [[ "${http_code}" =~ ^2[0-9][0-9]$ ]] || { echo "::error::Roblox rejected the publish request (HTTP ${http_code})."; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path("build/publish-response.json").read_text(encoding="utf-8"))
          version = response.get("versionNumber")
          if not isinstance(version, int) or version < 1:
              raise SystemExit("Roblox returned HTTP success without a valid published version number.")
          print(f"Published Roblox place version {version}.")
          PY
