name: Collision Battlestar Roblox Publisher

on:
  push:
    branches:
      - main
    paths:
      - ".github/publish/request.json"

  workflow_dispatch:
    inputs:
      confirm:
        description: "Publish the validated build to Roblox"
        required: true
        type: boolean
        default: false
      universe_id:
        description: "Roblox Universe ID"
        required: true
        type: string
        default: "5290480963"
      place_id:
        description: "Roblox Place ID"
        required: true
        type: string
        default: "15338267657"

permissions:
  contents: write

concurrency:
  group: collision-battlestar-roblox-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[collision-battlestar:auto-reset]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Resolve publication request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          INPUT_UNIVERSE_ID: ${{ inputs.universe_id }}
          INPUT_PLACE_ID: ${{ inputs.place_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          event = os.environ.get("EVENT_NAME", "")
          confirm = os.environ.get("CONFIRM", "").lower() == "true"
          input_universe = os.environ.get("INPUT_UNIVERSE_ID", "")
          input_place = os.environ.get("INPUT_PLACE_ID", "")

          expected_universe = "5290480963"
          expected_place = "15338267657"

          if event == "push":
              path = Path(".github/publish/request.json")

              if not path.is_file():
                  print("No publication request file found; nothing to publish.")
                  Path(os.environ["GITHUB_OUTPUT"]).write_text(
                      "publish=false\n", encoding="utf-8"
                  )
                  sys.exit(0)

              try:
                  request = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Invalid publish request JSON: {exc}")

              if request.get("publish") is not True:
                  print("Publication request is not armed; nothing will be published.")
                  Path(os.environ["GITHUB_OUTPUT"]).write_text(
                      "publish=false\n", encoding="utf-8"
                  )
                  sys.exit(0)

              universe = str(request.get("universe_id", ""))
              place = str(request.get("place_id", ""))

          elif event == "workflow_dispatch":
              if not confirm:
                  print("Manual publication was not confirmed; nothing will be published.")
                  Path(os.environ["GITHUB_OUTPUT"]).write_text(
                      "publish=false\n", encoding="utf-8"
                  )
                  sys.exit(0)

              universe = input_universe
              place = input_place

          else:
              raise SystemExit(f"Unsupported event: {event}")

          if universe != expected_universe:
              raise SystemExit(f"Unexpected Universe ID: {universe}")

          if place != expected_place:
              raise SystemExit(f"Unexpected Place ID: {place}")

          output = Path(os.environ["GITHUB_OUTPUT"])
          output.write_text(
              f"publish=true\nuniverse_id={universe}\nplace_id={place}\n",
              encoding="utf-8",
          )

          print(f"Publication armed for Universe {universe}, Place {place}")
          PY

      - name: Stop without publishing when not armed
        if: ${{ steps.request.outputs.publish != 'true' }}
        shell: bash
        run: echo "No publication requested."

      - name: Install Roblox toolchain
        if: ${{ steps.request.outputs.publish == 'true' }}
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true

      - name: Install Roblox tools
        if: ${{ steps.request.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rojo --version

      - name: Validate project
        if: ${{ steps.request.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_project.py

      - name: Build place
        if: ${{ steps.request.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          rojo build default.project.json --output build/CollisionBattlestar.rbxl

          test -s build/CollisionBattlestar.rbxl

          size="$(stat -c '%s' build/CollisionBattlestar.rbxl)"
          echo "Build size: ${size} bytes"

          if (( size < 1024 )); then
            echo "::error::The generated RBXL is unexpectedly small."
            exit 1
          fi

      - name: Publish to Roblox
        if: ${{ steps.request.outputs.publish == 'true' }}
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ steps.request.outputs.universe_id }}
          PLACE_ID: ${{ steps.request.outputs.place_id }}
        run: |
          set -euo pipefail

          if [[ -z "${ROBLOX_API_KEY}" ]]; then
            echo "::error::ROBLOX_API_KEY repository secret is missing."
            exit 1
          fi

          endpoint="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"

          echo "Publishing Collision Battlestar..."
          echo "Universe: ${UNIVERSE_ID}"
          echo "Place: ${PLACE_ID}"

          http_code="$(
            curl               --silent               --show-error               --location               --request POST               --url "${endpoint}"               --header "x-api-key: ${ROBLOX_API_KEY}"               --header "Content-Type: application/octet-stream"               --data-binary "@build/CollisionBattlestar.rbxl"               --output build/publish-response.json               --write-out "%{http_code}"
          )"

          echo "Roblox HTTP status: ${http_code}"

          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Roblox rejected the publish request."
            echo "Response body:"
            cat build/publish-response.json
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("build/publish-response.json").read_text(encoding="utf-8")
          )

          version = payload.get("versionNumber")

          if not isinstance(version, int) or version <= 0:
              raise SystemExit("Roblox did not return a valid versionNumber.")

          print(f"Published Roblox place version: {version}")
          PY

      - name: Reset automatic publish request
        if: ${{ github.event_name == 'push' && steps.request.outputs.publish == 'true' && success() }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(".github/publish/request.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["publish"] = False
          data["status"] = "consumed"
          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/publish/request.json
          git commit -m "[collision-battlestar:auto-reset] consume Roblox publish request"
          git push

      - name: Upload publication artifacts
        if: ${{ always() && steps.request.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: collision-battlestar-roblox-publish
          path: |
            build/CollisionBattlestar.rbxl
            build/publish-response.json
            build/build-sha256.txt
          if-no-files-found: warn
