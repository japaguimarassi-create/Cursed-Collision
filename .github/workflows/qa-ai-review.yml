name: Collision Battlestar Manual AI QA Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Review latest stored report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p qa/results
          if [[ ! -f qa/results/latest.json ]]; then
            printf '%s\n' "No stored runtime report." > qa/results/ai_review.md
            exit 0
          fi
          if [[ -z "${GEMINI_API_KEY}" ]]; then
            printf '%s\n' "AI review skipped: GEMINI_API_KEY repository secret is not configured." > qa/results/ai_review.md
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          report=json.loads(Path("qa/results/latest.json").read_text())
          prompt=(
              "Review this Collision Battlestar runtime QA report. "
              "Use only the evidence provided. Identify failed detectors, likely root causes, and concrete next fixes. "
              "Do not claim visual inspection unless the report says a capture is available.\n\n"
              + json.dumps(report,ensure_ascii=False,indent=2)
          )
          body=json.dumps({"contents":[{"parts":[{"text":prompt}]}],"generationConfig":{"maxOutputTokens":1200}}).encode()
          req=urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",
              data=body,
              headers={"Content-Type":"application/json","x-goog-api-key":os.environ["GEMINI_API_KEY"]},
              method="POST"
          )
          with urllib.request.urlopen(req,timeout=60) as response:
              data=json.load(response)
          result=data["candidates"][0]["content"]["parts"][0]["text"]
          Path("qa/results/ai_review.md").write_text("# Collision Battlestar AI QA Review\n\n"+result+"\n",encoding="utf-8")
          PY
