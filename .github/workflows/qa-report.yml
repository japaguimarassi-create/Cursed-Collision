name: Collision Battlestar QA Report

on:
  repository_dispatch:
    types: [collision-battlestar-qa]

permissions:
  contents: write

concurrency:
  group: collision-battlestar-qa
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Record runtime report
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload.report) }}
        run: |
          set -euo pipefail
          mkdir -p qa/results
          printf '%s' "$PAYLOAD" > qa/results/latest.json
          date -u +%Y-%m-%dT%H:%M:%SZ > qa/results/latest.timestamp
      - name: Build human-readable summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("qa/results/latest.json").read_text())
          lines=["# Collision Battlestar QA","",f"Status: **{report.get('status','UNKNOWN')}**",f"Passed: **{report.get('passed',0)}/{report.get('total',0)}**","", "| Detector | Result | Detail |","|---|---|---|"]
          for item in report.get("results",[]):
              mark="PASS" if item.get("pass") else "FAIL"
              lines.append(f"| {item.get('name','')} | {mark} | {item.get('detail','')} |")
          Path("qa/results/latest.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/results
          git commit -m "qa: record Collision Battlestar runtime report" || exit 0
          git push
