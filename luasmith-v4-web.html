<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuaSmith 4</title><style>body{font-family:system-ui;margin:0;background:#0d1016;color:#eef}main{max-width:980px;margin:auto;padding:24px}textarea{width:100%;min-height:180px;box-sizing:border-box;background:#151b24;color:#eef;border:1px solid #344054;border-radius:12px;padding:12px}button{margin:8px 8px 8px 0;padding:10px 14px;border:0;border-radius:10px;background:#287df0;color:white}pre{white-space:pre-wrap;background:#11151d;border:1px solid #30394a;border-radius:12px;padding:14px;min-height:160px}</style><main><h1>LuaSmith 4</h1><p>Repository-aware Roblox/Luau engineering agent.</p><textarea id="q"></textarea><br><button onclick="run('/search')">Search</button><button onclick="run('/generate')">Generate</button><button onclick="run('/repair')">Repair</button><pre id="o">Ready.</pre></main><script>async function run(p){const q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('o').textContent='Working...';const r=await fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q})});document.getElementById('o').textContent=JSON.stringify(await r.json(),null,2)}</script>
